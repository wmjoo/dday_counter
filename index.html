<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D-Day 카운터</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="selector-wrapper">
            <select id="event-selector">
                <option value="2026-03-28T14:00:00+09:00">2026 KBO 프로야구 개막</option>
                <option value="2027-01-01T00:00:00+09:00">2027년 새해</option>
            </select>
        </div>
        
        <div class="display-panel destination-time">
            <div class="panel-label">DESTINATION TIME</div>
            <div class="timer-display">
                <div class="time-unit">
                    <span class="number" id="days">00</span>
                </div>
                <div class="separator">:</div>
                <div class="time-unit">
                    <span class="number" id="hours">00</span>
                </div>
                <div class="separator">:</div>
                <div class="time-unit">
                    <span class="number" id="minutes">00</span>
                </div>
                <div class="separator">:</div>
                <div class="time-unit">
                    <span class="number" id="seconds">00</span>
                </div>
            </div>
            <div class="time-label">DAYS : HOURS : MINUTES : SECONDS</div>
        </div>

        <div class="display-panel present-time">
            <div class="panel-label">PRESENT TIME</div>
            <div class="time-display" id="current-time">-</div>
        </div>

        <div class="display-panel last-time">
            <div class="panel-label">LAST TIME DEPARTED</div>
            <div class="time-display" id="event-date">-</div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
